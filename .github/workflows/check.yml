name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: Скрипты, тесты и ссылки
    runs-on: ubuntu-latest
    env:
      STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить pytest
        run: python -m pip install --upgrade pip && python -m pip install -r examples/python/requirements-dev.txt

      - name: Установить ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Запустить обязательные проверки
        run: bash examples/check_all.sh

  docker-example:
    name: Сборка и запуск Docker-примера
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить compose.yaml, собрать и запустить
        working-directory: examples/docker
        run: |
          set -euo pipefail
          docker compose version
          docker compose config --quiet
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              echo "сервис не стал здоровым" >&2
              docker compose logs
              docker compose down
              exit 1
            fi
            sleep 2
          done
          first="$(curl -fsS http://127.0.0.1:8000/)"
          second="$(curl -fsS http://127.0.0.1:8000/)"
          echo "$first"
          echo "$second"
          python3 -c "import json,sys; a=json.loads(sys.argv[1]); b=json.loads(sys.argv[2]); assert a['visits']==1 and b['visits']==2, (a,b)" "$first" "$second"
          docker compose --profile tools run --rm checker
          docker compose down
